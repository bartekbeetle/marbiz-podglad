server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nieistniejąca ścieżka ma zwracać KOD 404, nie 200 z podmienioną treścią.
    # Soft-404 (200 na wszystko) sprawia, że wyszukiwarki indeksują śmieci —
    # punkt 7 checklisty startowej holdingu.
    error_page 404 /404.html;
    location = /404.html { internal; }

    # Katalogi z index.html: /kontakt → /kontakt/
    location / {
        try_files $uri $uri/ =404;
    }

    # Fonty i zdjęcia są niezmienne w obrębie wersji obrazu.
    location ~* \.(woff2|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # To jest PODGLĄD ROBOCZY dla klienta. Dodatkowa warstwa obok
    # <meta name="robots"> i robots.txt — nagłówek działa nawet wtedy,
    # gdy ktoś podlinkuje plik bezpośrednio.
    add_header X-Robots-Tag "noindex, nofollow" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css text/html application/json image/svg+xml;
    gzip_min_length 512;
}
